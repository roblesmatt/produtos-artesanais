<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo - Loja Artesanal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="cabecalho-container"></div>

    <main class="container-filtro">
  <!-- Inputs invisíveis para controlar o estado dos filtros -->
  <input type="radio" name="filtro-cat" id="cat-todos" checked>
  <input type="radio" name="filtro-cat" id="cat-linhas">
  <input type="radio" name="filtro-cat" id="cat-funcao">
  <input type="radio" name="filtro-cat" id="cat-ativos">
  <input type="radio" name="filtro-cat" id="cat-cores">

  <!-- Nível 1: Categorias Principais (Labels estilizadas como botões) -->
  <div class="menu-principal">
    <label for="cat-todos" class="btn-cat">TODOS</label>
    <label for="cat-linhas" class="btn-cat">LINHAS</label>
    <label for="cat-funcao" class="btn-cat">FUNÇÃO</label>
    <label for="cat-ativos" class="btn-cat">ATIVOS</label>
    <label for="cat-cores" class="btn-cat">CORES</label>
  </div>

  <!-- Área de Produtos -->
  <div class="lista-produtos" id="listaProdutos">
    <!-- Produto 1 (Exemplo da categoria Linhas) -->
    <div class="card-produto" data-cat="linhas">
      <div class="imagem-placeholder"></div>
      <h3>Sabonete Clássico</h3>
      <p>Descrição do produto clássico...</p>
    </div>

    <!-- Produto 2 (Exemplo da categoria Função) -->
    <div class="card-produto" data-cat="funcao">
      <div class="imagem-placeholder"></div>
      <h3>Produto de Função</h3>
      <p>Descrição do produto por função...</p>
    </div>
  </div>
</main>

  
  
  <script src="script.js"></script>
</body>
</html>
