<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Finalizar Pedido - Dados de Entrega</title>
<link rel="stylesheet" href="style.css"/>
</head>
<body>

<div id="cabecalho-container"></div>

</head>
<body>

  <div class="checkout-container">
    <h2>DADOS PARA ENTREGA<br>E FATURAÇÃO</h2>
    <form id="checkoutForm">
      <div class="form-group">
        <label for="nome">Nome:</label>
        <input type="text" id="nome" class="input" required placeholder="Digite o seu nome completo">
      </div>

      <div class="form-group">
        <label for="cpf">CPF:</label>
        <input type="text" id="cpf" class="input" required placeholder="000.000.000-00">
      </div>

      <div class="form-group">
    <label for="telefone">Telefone:</label>
    <input type="tel" id="telefone" class="input" required placeholder="(00) 00000-0000">
</div>

      <div class="form-group">
        <label for="endereco">Endereço:</label>
        <input type="text" id="endereco" class="input" required placeholder="Ex: Rua das Flores, 123 - Centro - SP">
      </div>

      <div class="form-group">
    <label for="cep">CEP:</label>
    <input type="text" id="cep" class="input" required placeholder="00000-000">
</div>

    <button class="button1" type="submit">Avançar para o WhatsApp</button>
  

<div class="descricao"><span>"Os seus dados são utilizados apenas para o envio do pedido via WhatsApp e não são armazenados em servidores externos."</span>
</div>
 </form>


  <script>
    document.getElementById('checkoutForm').addEventListener('submit', function(e) {
      e.preventDefault();

      // Recolhe todos os dados preenchidos no formulário (incluindo os novos)
      const nome = document.getElementById('nome').value;
      const cpf = document.getElementById('cpf').value;
      const telefone = document.getElementById('telefone').value;
      const endereco = document.getElementById('endereco').value;
      const cep = document.getElementById('cep').value;

      const dadosCliente = `*Dados do Cliente:*\n- Nome: ${nome}\n- CPF: ${cpf}\n- Telefone: ${telefone}\n- Endereço: ${endereco}\n- CEP: ${cep}\n\n`;

      // Resgata os produtos guardados no localStorage
      let carrinho = JSON.parse(localStorage.getItem("carrinho")) || [];
      let mensagemProdutos = "*Pedido:* \n";
      let totalGeral = 0;

      if (carrinho.length === 0) {
          alert("O seu carrinho está vazio!");
          return;
      }

      carrinho.forEach((item) => {
          let valorNumerico = parseFloat(
              item.preco.replace("R$", "").replace(".", "").replace(",", ".").trim()
          ) || 0;
          const subtotal = valorNumerico * item.quantidade;
          totalGeral += subtotal;

          mensagemProdutos += `- ${item.quantidade}x ${item.nome} (${item.preco}) [Subtotal: R$ ${subtotal.toFixed(2).replace(".", ",")}]\n`;
      });

      mensagemProdutos += `\n*Total do Pedido: R$ ${totalGeral.toFixed(2).replace(".", ",")}*`;

      const numeroWhatsApp = "5511996624974"; // Número correto com o 6 atualizado
      const mensagemFinal = dadosCliente + mensagemProdutos;
      const urlWhatsApp = `https://wa.me/${numeroWhatsApp}?text=${encodeURIComponent(mensagemFinal)}`;
      
      window.location.href = urlWhatsApp;
    });
  </script>

<script src="produtos.js"></script>
<script src="scripts.js"></script>
    
</body>
</html>
