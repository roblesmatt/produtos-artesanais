<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Produtos Artesanais</title>
<link rel="stylesheet" href="style.css"/>
</head>
<body>

<div id="cabecalho-container"></div>

<div class="container-filtros">
  <!-- Inputs do Menu Principal -->
  <input type="radio" name="principal" id="todos" checked>
  <input type="radio" name="principal" id="categorias">
  <input type="radio" name="principal" id="linhas">

  <!-- Inputs do Submenu: TODOS -->
  <input type="radio" name="sub-todos" id="sub-catalogo" checked>
  <input type="radio" name="sub-todos" id="sub-novidades">
  <input type="radio" name="sub-todos" id="sub-promocao">
  <input type="radio" name="sub-todos" id="sub-kit">

  <!-- Inputs do Submenu: CATEGORIAS -->
  <input type="radio" name="sub-categorias" id="sub-sabonete-corporal" checked>
  <input type="radio" name="sub-categorias" id="sub-oleo-corporal">
  <input type="radio" name="sub-categorias" id="sub-perfume-artesanal">
  <input type="radio" name="sub-categorias" id="sub-vela-aromatica">
  <input type="radio" name="sub-categorias" id="sub-shampoo-e-condicionador">
  <input type="radio" name="sub-categorias" id="sub-creme-capilar">
  <input type="radio" name="sub-categorias" id="sub-creme-facial">
  <input type="radio" name="sub-categorias" id="sub-locao-pos-barba">

  <!-- Inputs do Submenu: LINHAS -->
  <input type="radio" name="sub-linhas" id="sub-classico" checked>
  <input type="radio" name="sub-linhas" id="sub-premium">
  <input type="radio" name="sub-linhas" id="sub-esoterica">
  <input type="radio" name="sub-linhas" id="sub-roosi">
  <input type="radio" name="sub-linhas" id="sub-nopou">

  <!-- Menu Principal -->
  <div class="menu-linha menu-principal">
    <label for="todos">TODOS</label>
    <label for="categorias">CATEGORIAS</label>
    <label for="linhas">LINHAS</label>
  </div>

  <!-- Submenus -->
  <div class="menu-linha menu-submenu submenu-todos">
    <label for="sub-catalogo">CATÁLOGO</label>
    <label for="sub-novidades">NOVIDADES</label>
    <label for="sub-promocao">PROMOÇÃO</label>
    <label for="sub-kit">KIT</label>
  </div>

  <div class="menu-linha menu-submenu submenu-categorias">
    <label for="sub-sabonete-corporal">SABONETE CORPORAL</label>
    <label for="sub-oleo-corporal">ÓLEO CORPORAL</label>
    <label for="sub-perfume-artesanal">PERFUME ARTESANAL</label>
    <label for="sub-vela-aromatica">VELA AROMÁTICA</label>
    <label for="sub-shampoo-e-condicionador">SHAMPOO E CONDICIONADOR</label>
    <label for="sub-creme-capilar">CREME CAPILAR</label>
    <label for="sub-creme-facial">CREME FACIAL</label>
    <label for="sub-locao-pos-barba">LOÇÃO PÓS BARBA</label>
  </div>

  <div class="menu-linha menu-submenu submenu-linhas">
    <label for="sub-classico">CLÁSSICO</label>
    <label for="sub-premium">PREMIUM</label>
    <label for="sub-esoterica">ESOTÉRICA</label>
    <label for="sub-roosi">ROÓSI</label>
    <label for="sub-nopou">NOPOU</label>
  </div>



<!-- ----------------------------------------------------- -->



<div class="conteudo-vitrine">
  <!-- Submenu: TODOS -->
  <div class="vitrine-item item-catalogo"><div class="vitrine-grid" id="grid-catalogo"></div></div>
  <div class="vitrine-item item-novidades"><div class="vitrine-grid" id="grid-novidades"><div class="texto-temporario"><span>Nenhum produto<br>até o momento.</span></div></div></div>
  <div class="vitrine-item item-promocao"><div class="vitrine-grid" id="grid-promocao"></div></div>
  <div class="vitrine-item item-kit"><div class="vitrine-grid" id="grid-kit"><div class="texto-temporario"><span>Nenhum produto<br>até o momento.</span></div></div></div>

  <!-- Submenu: CATEGORIAS -->
  <div class="vitrine-item item-sabonete-corporal"><div class="vitrine-grid" id="grid-sabonete-corporal"></div></div>
  <div class="vitrine-item item-oleo-corporal"><div class="vitrine-grid" id="grid-oleo-corporal"><div class="texto-temporario"><span>Em breve.</span></div></div></div>
  <div class="vitrine-item item-perfume-artesanal"><div class="vitrine-grid" id="grid-perfume-artesanal"></div></div>
  <div class="vitrine-item item-vela-aromatica"><div class="vitrine-grid" id="grid-vela-aromatica"><div class="texto-temporario"><span>Em breve.</span></div></div></div>
  <div class="vitrine-item item-shampoo-e-condicionador"><div class="vitrine-grid" id="grid-shampoo-e-condicionador"><div class="texto-temporario"><span>Em breve.</span></div></div></div>
  <div class="vitrine-item item-creme-capilar"><div class="vitrine-grid" id="grid-creme-capilar"><div class="texto-temporario"><span>Em breve.</span></div></div></div>
  <div class="vitrine-item item-creme-facial"><div class="vitrine-grid" id="grid-creme-facial"><div class="texto-temporario"><span>Em breve.</span></div></div></div>
  <div class="vitrine-item item-locao-pos-barba"><div class="vitrine-grid" id="grid-locao-pos-barba"><div class="texto-temporario"><span>Em breve.</span></div></div></div>

<!-- Submenu: LINHAS -->
  <div class="vitrine-item item-classico"><div class="vitrine-grid" id="grid-classico"></div></div>
  <div class="vitrine-item item-premium"><div class="vitrine-grid" id="grid-premium"><div class="texto-temporario"><span>Produtos<br>mais sotisficado.<br><br>Em breve.</span></div></div></div>
  <div class="vitrine-item item-esoterica"><div class="vitrine-grid" id="grid-esoterica"><div class="texto-temporario"><span>Produtos<br>mais naturais.<br><br>Em breve.</span></div></div></div>
  <div class="vitrine-item item-roosi"><div class="vitrine-grid" id="grid-roosi"><div class="texto-temporario"><span>Produtos focados<br>em aromas de rosas.<br><br>Em breve.</span></div></div></div>
  <div class="vitrine-item item-nopou"><div class="vitrine-grid" id="grid-nopou"><div class="texto-temporario"><span>Produtos focados<br>para as técnicas<br>Low/No Poo.<br><br>Em breve.</span></div></div></div>
</div>

<script src="produtos.js" defer></script>
<script src="scripts.js" defer></script>
</body>
</html>
