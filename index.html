<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Perfume Artesanal</title>
<link rel="stylesheet" href="style.css"/>
</head>
<body>

<div id="cabecalho-container"></div>

<div class="container-filtros">
  <!-- Inputs do Menu Principal -->
  <input type="radio" name="principal" id="todos" checked>
  <input type="radio" name="principal" id="linhas">
  <input type="radio" name="principal" id="funcao">
  <input type="radio" name="principal" id="ativos">
  <input type="radio" name="principal" id="cores">

  <!-- Inputs do Submenu: TODOS -->
  <input type="radio" name="sub-todos" id="sub-mais-vendido" checked>
  <input type="radio" name="sub-todos" id="sub-lancamentos">
  <input type="radio" name="sub-todos" id="sub-promocao">

  <!-- Inputs do Submenu: LINHAS -->
  <input type="radio" name="sub-linhas" id="sub-classico" checked>
  <input type="radio" name="sub-linhas" id="sub-premium">
  <input type="radio" name="sub-linhas" id="sub-esoterica">
  <input type="radio" name="sub-linhas" id="sub-rosas">
  <input type="radio" name="sub-linhas" id="sub-nopou">

  <!-- Inputs do Submenu: FUNÇÃO -->
  <input type="radio" name="sub-funcao" id="sub-sabonete-corporal" checked>
  <input type="radio" name="sub-funcao" id="sub-sabonete-liquido">
  <input type="radio" name="sub-funcao" id="sub-perfume-artesanal">
  <input type="radio" name="sub-funcao" id="sub-vela-aromatica">
  <input type="radio" name="sub-funcao" id="sub-shampoo-e-condicionador">
  <input type="radio" name="sub-funcao" id="sub-creme-capilar">
  <input type="radio" name="sub-funcao" id="sub-creme-para-rosto">
  <input type="radio" name="sub-funcao" id="sub-locao-pos-barba">

  <!-- Inputs do Submenu: ATIVOS -->
  <input type="radio" name="sub-ativos" id="sub-capim-limao" checked>
  <input type="radio" name="sub-ativos" id="sub-lavanda-provence">
  <input type="radio" name="sub-ativos" id="sub-alecrim-rosmarino">
  <input type="radio" name="sub-ativos" id="sub-laranja-doce">
  <input type="radio" name="sub-ativos" id="sub-amendoa-doce">

  <!-- Inputs do Submenu: CORES (Acentuação removida do ID para evitar conflitos) -->
  <input type="radio" name="sub-cores" id="sub-verde" checked>
  <input type="radio" name="sub-cores" id="sub-amarelo">
  <input type="radio" name="sub-cores" id="sub-vermelho">
  <input type="radio" name="sub-cores" id="sub-laranja">
  <input type="radio" name="sub-cores" id="sub-branco">
  <input type="radio" name="sub-cores" id="sub-azul">
  <input type="radio" name="sub-cores" id="sub-rosa">
  <input type="radio" name="sub-cores" id="sub-lilas">

  <!-- Menu Principal -->
  <div class="menu-linha menu-principal">
    <label for="todos">TODOS</label>
    <label for="linhas">LINHAS</label>
    <label for="funcao">FUNÇÃO</label>
    <label for="ativos">ATIVOS</label>
    <label for="cores">CORES</label>
  </div>

  <!-- Submenus -->
  <div class="menu-linha menu-submenu submenu-todos">
    <label for="sub-mais-vendido">MAIS VENDIDO</label>
    <label for="sub-lancamentos">LANÇAMENTOS</label>
    <label for="sub-promocao">PROMOÇÃO</label>
  </div>

  <div class="menu-linha menu-submenu submenu-linhas">
    <label for="sub-classico">CLÁSSICO</label>
    <label for="sub-premium">PREMIUM</label>
    <label for="sub-esoterica">ESOTÉRICA</label>
    <label for="sub-rosas">ROSAS</label>
    <label for="sub-nopou">NOPOU</label>
  </div>

  <div class="menu-linha menu-submenu submenu-funcao">
    <label for="sub-sabonete-corporal">SABONETE CORPORAL</label>
    <label for="sub-sabonete-liquido">SABONETE LÍQUIDO</label>
    <label for="sub-perfume-artesanal">PERFUME ARTESANAL</label>
    <label for="sub-vela-aromatica">VELA AROMÁTICA</label>
    <label for="sub-shampoo-e-condicionador">SHAMPOO E CONDICIONADOR</label>
    <label for="sub-creme-capilar">CREME CAPILAR</label>
    <label for="sub-creme-para-rosto">CREME PARA ROSTO</label>
    <label for="sub-locao-pos-barba">LOÇÃO PÓS BARBA</label>
  </div>
  
  <div class="menu-linha menu-submenu submenu-ativos">
    <label for="sub-capim-limao">CAPIM LIMÃO</label>
    <label for="sub-lavanda-provence">LAVANDA PROVENCE</label>
    <label for="sub-alecrim-rosmarino">ALECRIM ROSMARINO</label>
    <label for="sub-laranja-doce">LARANJA DOCE</label>
    <label for="sub-amendoa-doce">AMÊNDOA DOCE</label>
  </div>

  <div class="menu-linha menu-submenu submenu-cores">
    <label for="sub-verde">VERDE</label>
    <label for="sub-amarelo">AMARELO</label>
    <label for="sub-vermelho">VERMELHO</label>
    <label for="sub-laranja">LARANJA</label>
    <label for="sub-branco">BRANCO</label>
    <label for="sub-azul">AZUL</label>
    <label for="sub-rosa">ROSA</label>
    <label for="sub-lilas">LILÁS</label>
  </div>



<!-- ----------------------------------------------------- -->



<div class="conteudo-vitrine">
  <!-- Submenu: TODOS -->
  <div class="vitrine-item item-mais-vendido"><div class="vitrine-grid" id="grid-mais-vendido"></div></div>
  <div class="vitrine-item item-lancamentos"><div class="vitrine-grid" id="grid-lancamentos"><div class="texto-temporario"><span>Nenhum produto<br>até o momento.</span></div></div></div>
  <div class="vitrine-item item-promocao"><div class="vitrine-grid" id="grid-promocao"></div></div>

  <!-- Submenu: LINHAS -->
  <div class="vitrine-item item-classico"><div class="vitrine-grid" id="grid-classico"></div></div>
  <div class="vitrine-item item-premium"><div class="vitrine-grid" id="grid-premium"><div class="texto-temporario"><span>Produtos<br>mais sotisficado.<br><br>Em breve.</span></div></div></div>
  <div class="vitrine-item item-esoterica"><div class="vitrine-grid" id="grid-esoterica"><div class="texto-temporario"><span>Produtos<br>mais naturais.<br><br>Em breve.</span></div></div></div>
  <div class="vitrine-item item-rosas"><div class="vitrine-grid" id="grid-rosas"><div class="texto-temporario"><span>Produtos focados<br>em aromas de rosas.<br><br>Em breve.</span></div></div></div>
  <div class="vitrine-item item-nopou"><div class="vitrine-grid" id="grid-nopou"><div class="texto-temporario"><span>Produtos focados<br>para as técnicas<br>Low/No Poo.<br><br>Em breve.</span></div></div></div>

  <!-- Submenu: FUNÇÃO -->
  <div class="vitrine-item item-sabonete-corporal"><div class="vitrine-grid" id="grid-sabonete-corporal"></div></div>
  <div class="vitrine-item item-sabonete-liquido"><div class="vitrine-grid" id="grid-sabonete-liquido"></div></div>
  <div class="vitrine-item item-perfume-artesanal"><div class="vitrine-grid" id="grid-perfume-artesanal"></div></div>
  <div class="vitrine-item item-vela-aromatica"><div class="vitrine-grid" id="grid-vela-aromatica"><div class="texto-temporario"><span>Em breve.</span></div></div></div>
  <div class="vitrine-item item-shampoo-e-condicionador"><div class="vitrine-grid" id="grid-shampoo-e-condicionador"><div class="texto-temporario"><span>Em breve.</span></div></div></div>
  <div class="vitrine-item item-creme-capilar"><div class="vitrine-grid" id="grid-creme-capilar"><div class="texto-temporario"><span>Em breve.</span></div></div></div>
  <div class="vitrine-item item-creme-para-rosto"><div class="vitrine-grid" id="grid-creme-para-rosto"><div class="texto-temporario"><span>Em breve.</span></div></div></div>
  <div class="vitrine-item item-locao-pos-barba"><div class="vitrine-grid" id="grid-locao-pos-barba"><div class="texto-temporario"><span>Em breve.</span></div></div></div>

  <!-- Submenu: ATIVOS -->
  <div class="vitrine-item item-capim-limao"><div class="vitrine-grid" id="grid-capim-limao"></div></div>
  <div class="vitrine-item item-lavanda-provence"><div class="vitrine-grid" id="grid-lavanda-provence"></div></div>
  <div class="vitrine-item item-alecrim-rosmarino"><div class="vitrine-grid" id="grid-alecrim-rosmarino"></div></div>
  <div class="vitrine-item item-laranja-doce"><div class="vitrine-grid" id="grid-laranja-doce"></div></div>
  <div class="vitrine-item item-amendoa-doce"><div class="vitrine-grid" id="grid-amendoa-doce"></div></div>

  <!-- Submenu: CORES -->
  <div class="vitrine-item item-verde"><div class="vitrine-grid" id="grid-verde"></div></div>
  <div class="vitrine-item item-amarelo"><div class="vitrine-grid" id="grid-amarelo"></div></div>
  <div class="vitrine-item item-vermelho"><div class="vitrine-grid" id="grid-vermelho"></div></div>
  <div class="vitrine-item item-laranja"><div class="vitrine-grid" id="grid-laranja"></div></div>
  <div class="vitrine-item item-branco"><div class="vitrine-grid" id="grid-branco"></div></div>
  <div class="vitrine-item item-azul"><div class="vitrine-grid" id="grid-azul"></div></div>
  <div class="vitrine-item item-rosa"><div class="vitrine-grid" id="grid-rosa"></div></div>
  <div class="vitrine-item item-lilas"><div class="vitrine-grid" id="grid-lilas"></div></div>
</div>

<script src="scripts.js" defer></script>
</body>
</html>
