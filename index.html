<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo - Loja Artesanal</title>
    <link rel="stylesheet" href="style.css">
    <!-- Ícones Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body>

<div id="cabecalho-container"></div>

    <!-- 2. CONTEÚDO PRINCIPAL (VITRINE COM VÁRIOS PRODUTOS DE EXEMPLO) -->
    <main class="conteudo-principal" style="padding: 40px; max-width: 1100px; margin: 0 auto;">
        <h2>Nossos Produtos</h2>

        <div style="display: flex; gap: 20px; flex-wrap: wrap; margin-top: 20px;">
            
            <!-- Produto 1 -->
             <a href="perfume-artesanal-capim-limao.html"><div class="product-card" style="border: 2px solid #3d2d2d; padding: 15px; border-radius: 8px; width: 220px; background: #e0d4b9;">
                <img src="produtos/thairo-1x1.svg" alt="Perfume" style="width: 100%; height: 180px; object-fit: cover; border-radius: 6px;">
                <h3 style="font-size: 16px; margin: 10px 0 5px 0;">Perfume Artesanal de Capim Limão</h3>
                <span class="preco" style="font-weight: bold; color: #111;">R$ 79,90</span>
            </div></a>

            <!-- Produto 1 -->
             <a href="perfume-artesanal-lavanda-provence.html"><div class="product-card" style="border: 2px solid #3d2d2d; padding: 15px; border-radius: 8px; width: 220px; background: #e0d4b9;">
                <img src="produtos/thairo-1x1.svg" alt="Perfume" style="width: 100%; height: 180px; object-fit: cover; border-radius: 6px;">
                <h3 style="font-size: 16px; margin: 10px 0 5px 0;">Perfume Artesanal de Lavanda Provence</h3>
                <span class="preco" style="font-weight: bold; color: #111;">R$ 79,90</span>
            </div></a>
            
            <!-- Produto 2 -->
            <div class="product-card" style="border: 1px solid #ddd; padding: 15px; border-radius: 8px; width: 220px; background: #fff;">
                <img src="sua-imagem2.jpg" alt="Sabonete" style="width: 100%; height: 180px; object-fit: cover; border-radius: 6px;">
                <h3 style="font-size: 16px; margin: 10px 0 5px 0;">Sabonete Artesanal de Fubá</h3>
                <span class="preco" style="font-weight: bold; color: #111;">R$ 25,00</span>
            </div>

            <!-- Produto 3 -->
            <div class="product-card" style="border: 1px solid #ddd; padding: 15px; border-radius: 8px; width: 220px; background: #fff;">
                <img src="sua-imagem3.jpg" alt="Esfoliante" style="width: 100%; height: 180px; object-fit: cover; border-radius: 6px;">
                <h3 style="font-size: 16px; margin: 10px 0 5px 0;">Esfoliante Corporal de Mel</h3>
                <span class="preco" style="font-weight: bold; color: #111;">R$ 45,00</span>
            </div>

            <!-- Produto 4 -->
            <div class="product-card" style="border: 1px solid #ddd; padding: 15px; border-radius: 8px; width: 220px; background: #fff;">
                <img src="sua-imagem4.jpg" alt="Perfume" style="width: 100%; height: 180px; object-fit: cover; border-radius: 6px;">
                <h3 style="font-size: 16px; margin: 10px 0 5px 0;">Perfume Botânico Lavanda</h3>
                <span class="preco" style="font-weight: bold; color: #111;">R$ 89,90</span>
            </div>

        </div>
    </main>

<script>
  fetch('global.html')
    .then(response => response.text())
    .then(data => {
      // 1. Injeta o header, menu e o modal de busca na página
      document.getElementById('cabecalho-container').innerHTML = data;

      // --- TUDO O QUE DEPENDE DO HEADER/MODAL DEVE FICAR AQUI DENTRO ---

      // 2. Lógica do Menu Hambúrguer (Mobile)
      const menuToggle = document.getElementById('menuToggle');
      const navMenu = document.getElementById('navMenu');
      const menuFechar = document.getElementById('menuFechar');

      if (menuToggle && navMenu) {
        menuToggle.addEventListener('click', () => navMenu.classList.add('ativo'));
      }
      if (menuFechar && navMenu) {
        menuFechar.addEventListener('click', () => navMenu.classList.remove('ativo'));
      }

      // 3. Lógica da Busca e do Modal de Pesquisa
      const searchInput = document.getElementById('searchInput');
      const searchModal = document.getElementById('searchModal');
      const closeSearchModal = document.getElementById('closeSearchModal');
      const searchResultsList = document.getElementById('searchResultsList');

      // Lista dos teus produtos
      const produtosDisponiveis = [
        { nome: "Perfume Artesanal de Capim Limão", preco: "R$ 79,90", imagem: "sua-imagem.jpg", link: "index.html" },
        { nome: "Sabonete Artesanal de Fubá", preco: "R$ 25,00", imagem: "sua-imagem2.jpg", link: "#" },
        { nome: "Esfoliante Corporal de Mel", preco: "R$ 45,00", imagem: "sua-imagem3.jpg", link: "#" },
        { nome: "Perfume Botânico Lavanda", preco: "R$ 89,90", imagem: "sua-imagem4.jpg", link: "#" }
      ];

      if (searchInput && searchModal) {
        searchInput.addEventListener('input', (e) => {
          const termo = e.target.value.toLowerCase().trim();

          if (termo.length > 0) {
            searchModal.style.display = 'flex';
            searchResultsList.innerHTML = '';

            let encontrados = 0;

            produtosDisponiveis.forEach(produto => {
              if (produto.nome.toLowerCase().includes(termo)) {
                encontrados++;
                const item = document.createElement('a');
                item.href = produto.link;
                item.className = 'search-result-card';
                item.innerHTML = `
                  <img src="${produto.imagem}" alt="" style="width: 50px; height: 50px; object-fit: cover; border-radius: 4px;">
                  <div>
                    <h4 style="margin: 0 0 4px 0; font-size: 14px; color: #333;">${produto.nome}</h4>
                    <span style="font-size: 13px; font-weight: bold; color: #111;">${produto.preco}</span>
                  </div>
                `;
                searchResultsList.appendChild(item);
              }
            });

            if (encontrados === 0) {
              searchResultsList.innerHTML = '<p style="color: #777; text-align: center; padding: 10px;">Nenhum produto encontrado</p>';
            }
          } else {
            searchModal.style.display = 'none';
          }
        });
      }

      if (closeSearchModal) {
        closeSearchModal.addEventListener('click', () => {
          searchModal.style.display = 'none';
          searchInput.value = '';
        });
      }
    });
</script>

</body>
</html>
